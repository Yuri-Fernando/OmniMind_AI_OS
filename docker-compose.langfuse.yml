# Langfuse v3 self-host (web + worker + Postgres + ClickHouse + Redis + MinIO).
#
# STATUS: BLOCKED_BY_CONFIGURATION — este arquivo NÃO foi executado nesta sessão (a stack exige ~4 GB de RAM e
# segredos próprios). Foi escrito a partir da topologia documentada do Langfuse v3 e precisa ser validado na
# primeira subida. Nenhum segredo está aqui: tudo vem de `.env.langfuse` (copie `langfuse.env.example`).
#
#   cp langfuse.env.example .env.langfuse  # e preencha TODOS os valores
#   docker compose --env-file .env.langfuse -f docker-compose.langfuse.yml up -d
#   # abra http://127.0.0.1:3000, crie org/projeto e copie as chaves para LANGFUSE_PUBLIC_KEY/SECRET_KEY/HOST no .env
#
# Todas as portas ficam presas a 127.0.0.1 (nada exposto na rede).
name: omnimind-langfuse

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?defina LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?defina LANGFUSE_ENCRYPTION_KEY (64 hex)}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?defina LANGFUSE_NEXTAUTH_SECRET}
  NEXTAUTH_URL: http://127.0.0.1:3000
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?defina CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?defina REDIS_AUTH}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    depends_on: [postgres, clickhouse, redis, minio]
    ports: ["127.0.0.1:3000:3000"]
    environment: *langfuse-env

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    depends_on: [postgres, clickhouse, redis, minio]
    ports: ["127.0.0.1:3030:3030"]
    environment: *langfuse-env

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?defina CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports: ["127.0.0.1:8123:8123"]

  minio:
    image: docker.io/minio/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    volumes: [langfuse_minio_data:/data]
    ports: ["127.0.0.1:9090:9000"]

  redis:
    image: docker.io/redis:7
    command: ["--requirepass", "${REDIS_AUTH:?defina REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]

  postgres:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes: [langfuse_postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
